name: Restore node_modules
description: Set up Node 22 and restore the cached node_modules saved by the setup job. Restore-only — never saves, so parallel jobs do not race on the same cache key. Caller must run actions/checkout before this action so the local action file is on disk.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: 22
    - uses: actions/cache/restore@v4
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
        fail-on-cache-miss: true
