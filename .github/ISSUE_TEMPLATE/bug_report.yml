name: Bug report
description: meta-mcp does not behave as the docs or the Meta API contract say it should.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please search [existing issues](https://github.com/exileum/meta-mcp/issues?q=is%3Aissue) first — many bugs already have a tracking issue or a fix on the way.

  - type: input
    id: meta-mcp-version
    attributes:
      label: meta-mcp version
      description: Run `npm list @exileum/meta-mcp` (or check `package.json`).
      placeholder: e.g. 5.0.0
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Output of `node --version`.
      placeholder: e.g. v22.11.0
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - Instagram tool (ig_*)
        - Threads tool (threads_*)
        - Meta auth / webhook tool (meta_*)
        - MCP resource or prompt
        - Server runtime / config / startup
        - Build, CI, or packaging
        - Other
    validations:
      required: true

  - type: input
    id: tool-name
    attributes:
      label: Tool or resource name
      description: If the bug is in a specific tool/resource, name it.
      placeholder: e.g. ig_publish_carousel

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: A minimal sequence we can follow.
      placeholder: |
        1. Configure ...
        2. Call ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen, and which Meta API doc backs that expectation?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happened instead?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error output / sanitized logs
      description: Paste error responses, stack traces, or relevant logs. **Remove access tokens, app secrets, and any other credentials before posting.**
      render: shell

  - type: input
    id: meta-docs
    attributes:
      label: Meta API documentation link
      description: Optional — the page that defines the expected behaviour.
      placeholder: e.g. https://developers.facebook.com/docs/instagram-platform/...

  - type: checkboxes
    id: hygiene
    attributes:
      label: Before submitting
      options:
        - label: I removed access tokens, app secrets, and other credentials from this report.
          required: true
        - label: I searched existing issues and could not find this bug already reported.
          required: true
